services:
  postgres:
    image: postgres:16-alpine
    container_name: neutral-sensors-db
    environment:
      POSTGRES_USER: neutral
      POSTGRES_PASSWORD: neutral
      POSTGRES_DB: sensors
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neutral -d sensors"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
